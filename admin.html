<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Admin · ทำเนียบชมรมกรีฑา</title>
<meta name="theme-color" content="#141111">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ชมรมกรีฑา">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
</head>
<body data-mode="admin">
<div class="nav"><div class="in">
    <a class="brand" href="index.html"><img src="logo.png" alt="โลโก้ชมรมกรีฑา"><span><b>ชมรมกรีฑา รร.นรต.</b><small>ทำเนียบชมรมกรีฑา · since 1982</small></span></a>
    <a class="l" href="index.html">สืบค้นทำเนียบ</a>
    <a class="l on" href="admin.html">Admin</a>
  </div></div><div class="stripe"></div>
<main>
  <h1 class="title"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>สำหรับผู้ดูแล</h1>
  <p class="sub">โทรสอบถาม อัปเดต และแก้ไขข้อมูลทำเนียบชมรมกรีฑา</p>

  <div id="login" class="panel">
    <h2 style="margin:0 0 4px;font-size:22px">เข้าสู่ระบบ</h2>
    <p class="s" style="margin:0 0 16px">ใส่ชื่อของคุณและรหัสผู้ดูแล</p>
    <div class="grid">
      <div><label for="caller">ชื่อของคุณ</label><input class="field" id="caller" placeholder="เช่น นตท.สมชาย ใจดี" autocomplete="off"></div>
      <div><label for="code">รหัสผู้ดูแล</label><input class="field" id="code" type="password" autocomplete="off"></div>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn red" id="loginBtn" type="button">เข้าสู่ระบบ</button></div>
  </div>

  <div id="app" hidden>
    <div class="panel" style="margin:0 auto 18px">
      <div class="row" style="justify-content:space-between"><b>ความคืบหน้าปีนี้ (อัปเดตแล้ว)</b><span class="s" id="stats"></span></div>
      <div class="progress"><i id="bar" style="width:0"></i></div>
      <div class="row" style="margin-top:10px;justify-content:space-between"><button class="btn ghost" id="addBtn" type="button">+ เพิ่มรายชื่อ</button><button class="btn text" id="logout" type="button">ออกจากระบบ</button></div>
    </div>
  <form id="searchForm" class="searchbar" role="search">
    <input id="q" type="search" placeholder="พิมพ์ชื่อ ฉายา ตำแหน่ง หรือ “รุ่น 38” เพื่อค้นหา…" aria-label="ค้นหา" autocomplete="off">
    <button class="btn" type="button" id="filterBtn" aria-expanded="false" aria-controls="filters"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 4h18l-7 8.5V20l-4-2v-5.5z"/></svg><span>ตัวกรอง</span></button>
    <button class="btn red" type="submit" aria-label="ค้นหา"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>ค้นหา</span></button>
  </form>
  <div id="filters" class="panel" hidden>
    <div class="grid">
      <div><label for="f_gen">รุ่น</label><input class="field" id="f_gen" inputmode="numeric" placeholder="เช่น 79"></div>
      <div><label for="f_first">ชื่อจริง</label><input class="field" id="f_first" placeholder="เช่น ธนวัฒน์/ธนเดช"></div>
      <div class="wide"><label for="f_last">นามสกุล</label><input class="field" id="f_last" placeholder="เช่น โชติรัตน์อมรกุล/สงวนสัตย์"></div>
      <div><label for="f_nick">ชื่อเล่น หรือ ฉายา</label><input class="field" id="f_nick" placeholder="เช่น หาว/ดอนนี่"></div>
      <div><label for="f_dist">ระยะ</label><input class="field" id="f_dist" placeholder="เช่น ขว้างจักร/100"></div>
      <div><label for="f_fresh">สถานะข้อมูล</label><select class="field" id="f_fresh"><option value="">ทุกคน</option><option value="stale">ยังไม่อัปเดตปีนี้</option><option value="fresh">อัปเดตปีนี้แล้ว</option></select></div>
    </div>
    <div class="row" style="margin-top:14px"><button class="btn red" type="submit" form="searchForm">ค้นหา</button><button class="btn text" type="button" id="clear">ล้างทั้งหมด</button></div>
  </div>
  <div id="msg" class="msg" hidden></div>
  <section id="results" hidden>
    <div class="summary" id="sum"></div>
    <div class="tablewrap"><table>
      <thead><tr><th class="c">ลำดับ</th><th class="c">รุ่น</th><th>ยศ-ชื่อ-นามสกุล</th><th>ตำแหน่ง</th><th class="c">ระยะ</th><th>โทรศัพท์</th><th>สถานะ / จัดการ</th></tr></thead>
      <tbody id="tbody"></tbody></table></div>
    <div class="cards" id="cards"></div>
    <div class="pager" id="pager"></div>
  </section>
  </div>
</main>
<dialog id="dlg"><form id="dlgForm" method="dialog" novalidate>
  <h2 id="dlgTitle">แก้ไขข้อมูล</h2>
  <div class="two"><div><label for="e_rank">ยศ</label><input class="field" id="e_rank"></div><div><label for="e_gen">นรต.รุ่น</label><input class="field" id="e_gen" inputmode="numeric"></div></div>
  <div><label for="e_name">ชื่อ-สกุล</label><input class="field" id="e_name"></div>
  <div><label for="e_nick">ชื่อเล่น / ฉายา</label><input class="field" id="e_nick"></div>
  <div><label for="e_pos">ตำแหน่งปัจจุบัน (หรือ เกษียณ / ลาออก)</label><textarea class="field" id="e_pos" rows="3"></textarea></div>
  <div class="two"><div><label for="e_phone">เบอร์โทร (หลายเบอร์คั่นด้วย , )</label><input class="field" id="e_phone" type="tel"></div><div><label for="e_dist">ระยะ</label><input class="field" id="e_dist"></div></div>
  <div class="row"><button class="btn red" type="submit">บันทึก</button><button class="btn text" type="button" id="dlgCancel">ยกเลิก</button></div>
</form></dialog>
<script src="config.js?v=4"></script>
<script src="app.js?v=4"></script>
</body></html>

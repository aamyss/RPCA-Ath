<main>
  <h1 class="title"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>ค้นหาชมรมกรีฑา</h1>
  <p class="sub">ทำเนียบชมรมกรีฑา โรงเรียนนายร้อยตำรวจ</p>
  <div id="app">
  <form id="searchForm" class="searchbar" role="search">
    <input id="q" type="search" placeholder="พิมพ์ชื่อ สกุล ตำแหน่ง หรือ “รุ่น 79” เพื่อค้นหา…" aria-label="ค้นหา" autocomplete="off">
    <button class="btn" type="button" id="filterBtn" aria-expanded="false" aria-controls="filters"><svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 4h18l-7 8.5V20l-4-2v-5.5z"/></svg><span>ตัวกรอง</span></button>
    <button class="btn red" type="submit" aria-label="ค้นหา"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span>ค้นหา</span></button>
  </form>
  <div id="filters" class="panel" hidden>
    <div class="grid">
      <div><label for="f_gen">รุ่น</label><input class="field" id="f_gen" inputmode="numeric" placeholder="เช่น 79"></div>
      <div><label for="f_first">ชื่อจริง</label><input class="field" id="f_first" placeholder="เช่น ธนวัฒน์/ธนเดช"></div>
      <div class="wide"><label for="f_last">นามสกุล</label><input class="field" id="f_last" placeholder="เช่น โชติรัตน์อมรกุล/สงวนสัตย์"></div>
      <div><label for="f_nick">ชื่อเล่น หรือ ฉายา</label><input class="field" id="f_nick" placeholder="เช่น หาว/ดอนนี่"></div>
      <div><label for="f_dist">ระยะ</label><input class="field" id="f_dist" placeholder="เช่น ขว้างจักร/100"></div>
      
    </div>
    <div class="row" style="margin-top:14px"><button class="btn red" type="submit" form="searchForm">ค้นหา</button><button class="btn text" type="button" id="clear">ล้างทั้งหมด</button></div>
  </div>
  <div id="msg" class="msg" hidden></div>
  <section id="browse" hidden></section>
  <section id="results" hidden>

    <div class="tablewrap"><table>
      <thead><tr><th class="c">ลำดับ</th><th class="c">รุ่น</th><th>ยศ-ชื่อ-นามสกุล</th><th>ตำแหน่ง</th><th class="c">ระยะ</th><th>โทรศัพท์</th></tr></thead>

    <div class="pager" id="pager"></div>
